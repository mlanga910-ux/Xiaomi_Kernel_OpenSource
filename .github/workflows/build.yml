 name: Build dandelion (Redmi 9C NFC) kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel sources
        uses: actions/checkout@v4
        with:
          ref: dandelion-q-oss

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libssl-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libncurses-dev zip git python3 device-tree-compiler \
            libelf-dev lzop lz4

      - name: Disable legacy DrvGen and internal dtc
        run: |
          sed -i 's/DrvGen.py/# DrvGen disabled for CI/g' scripts/drvgen/drvgen.mk || true
          sed -i 's/^hostprogs-y.*dtc/# &/' scripts/dtc/Makefile || true

      - name: Ensure gadget/netfilter configs
        run: |
          DEFCONFIG=arch/arm64/configs/dandelion_defconfig
          ensure() { grep -q "^$1" "$DEFCONFIG" || echo "$1" >> "$DEFCONFIG"; }
          ensure 'CONFIG_USB_GADGET=y'
          ensure 'CONFIG_USB_CONFIGFS=y'
          ensure 'CONFIG_USB_CONFIGFS_HID=y'
          ensure 'CONFIG_USB_CONFIGFS_MASS_STORAGE=y'
          ensure 'CONFIG_USB_CONFIGFS_ECM=y'
          ensure 'CONFIG_USB_CONFIGFS_NCM=y'
          ensure 'CONFIG_USB_CONFIGFS_RNDIS=y'
          ensure 'CONFIG_USB_OTG=y'
          ensure 'CONFIG_PACKET=y'
          ensure 'CONFIG_PACKET_MMAP=y'
          ensure 'CONFIG_NETFILTER=y'
          ensure 'CONFIG_NETFILTER_XTABLES=y'
          ensure 'CONFIG_NETFILTER_NETLINK=y'
          ensure 'CONFIG_TUN=y'
          ensure 'CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y'
          ensure 'CONFIG_NETFILTER_XT_MATCH_STATE=y'
          ensure 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y'
          ensure 'CONFIG_NETFILTER_XT_MATCH_OWNER=y'
          ensure 'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y'
          ensure 'CONFIG_NETFILTER_XT_TARGET_REDIRECT=y'
          ensure 'CONFIG_NETFILTER_XT_TARGET_LOG=y'

      - name: Build kernel (Image + dtbs)
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make O=out KCFLAGS=-Wno-error DTC_EXT=/usr/bin/dtc dandelion_defconfig
          make O=out KCFLAGS=-Wno-error DTC_EXT=/usr/bin/dtc Image dtbs -j$(nproc) | tee build.log || \
          make O=out KCFLAGS=-Wno-error DTC_EXT=/usr/bin/dtc Image.gz dtbs -j$(nproc) | tee build.log
          ls -lh out/arch/arm64/boot/ || true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          DTB_PATH=$(ls out/arch/arm64/boot/dandelion.dtb 2>/dev/null || ls out/arch/arm64/boot/*.dtb | head -n1)
          cp "$DTB_PATH" AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 ../dandelion-hid-netfilter.zip *
          ls -lh ../dandelion-hid-netfilter.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-hid-netfilter
          path: dandelion-hid-netfilter.zip
