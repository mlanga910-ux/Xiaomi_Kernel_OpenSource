name: Build dandelion (Redmi 9C NFC) kernel (allmodconfig + hacking modules)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel sources
        uses: actions/checkout@v4
        with:
          ref: dandelion-q-oss

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bc flex bison libssl-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libncurses-dev zip git python3 device-tree-compiler \
            libelf-dev lzop lz4

      - name: Disable legacy DrvGen and internal dtc
        run: |
          sed -i 's/DrvGen.py/# DrvGen disabled for CI/g' scripts/drvgen/drvgen.mk || true
          sed -i 's/^hostprogs-y.*dtc/# &/' scripts/dtc/Makefile || true

      - name: Configure kernel (allmodconfig + hacking modules)
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          make O=out KCFLAGS=-Wno-error DTC_EXT=/usr/bin/dtc allmodconfig
          DEFCONFIG=out/.config
          ensure() { grep -q "^$1" "$DEFCONFIG" || echo "$1" >> "$DEFCONFIG"; }
          # Netfilter / NAT / proxy
          ensure 'CONFIG_NETFILTER=y'
          ensure 'CONFIG_NETFILTER_XTABLES=y'
          ensure 'CONFIG_NETFILTER_NETLINK=y'
          ensure 'CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y'
          ensure 'CONFIG_NETFILTER_XT_MATCH_STATE=y'
          ensure 'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y'
          ensure 'CONFIG_NETFILTER_XT_MATCH_OWNER=y'
          ensure 'CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y'
          ensure 'CONFIG_NETFILTER_XT_TARGET_REDIRECT=y'
          ensure 'CONFIG_NETFILTER_XT_TARGET_LOG=y'
          # Tun/tap + packet capture
          ensure 'CONFIG_TUN=y'
          ensure 'CONFIG_PACKET=y'
          ensure 'CONFIG_PACKET_MMAP=y'
          # USB gadget HID/mass storage/RNDIS
          ensure 'CONFIG_USB_GADGET=y'
          ensure 'CONFIG_USB_CONFIGFS=y'
          ensure 'CONFIG_USB_CONFIGFS_HID=y'
          ensure 'CONFIG_USB_CONFIGFS_MASS_STORAGE=y'
          ensure 'CONFIG_USB_CONFIGFS_ECM=y'
          ensure 'CONFIG_USB_CONFIGFS_NCM=y'
          ensure 'CONFIG_USB_CONFIGFS_RNDIS=y'
          ensure 'CONFIG_USB_OTG=y'
          # Wi-Fi stack
          ensure 'CONFIG_CFG80211=y'
          ensure 'CONFIG_MAC80211=y'
          # Bluetooth stack
          ensure 'CONFIG_BT=y'
          ensure 'CONFIG_BT_HIDP=y'
          ensure 'CONFIG_BT_L2CAP=y'
          ensure 'CONFIG_BT_RFCOMM=y'
          ensure 'CONFIG_BT_BNEP=y'
          # Disable module signing (fix OpenSSL 3.0 error)
          ensure 'CONFIG_MODULE_SIG=n'

      - name: Build kernel (Image only, strict)
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          make O=out KCFLAGS=-Wno-error DTC_EXT=/usr/bin/dtc Image -j$(nproc) | tee build.log
          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "Fallback to Image.gz"
            make O=out KCFLAGS=-Wno-error DTC_EXT=/usr/bin/dtc Image.gz -j$(nproc) | tee -a build.log
          fi
          ls -lh out/arch/arm64/boot/

      - name: Upload build log and config
        uses: actions/upload-artifact@v4
        with:
          name: build-log-and-config
          path: |
            build.log
            out/.config

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git
          IMG_PATH=''
          if [ -f out/arch/arm64/boot/Image ]; then IMG_PATH=out/arch/arm64/boot/Image; fi
          if [ -z "$IMG_PATH" ] && [ -f out/arch/arm64/boot/Image.gz ]; then IMG_PATH=out/arch/arm64/boot/Image.gz; fi
          cp "$IMG_PATH" AnyKernel3/
          cd AnyKernel3
          zip -r9 ../dandelion-allmod-hacking.zip *
          cd ..
          ls -lh dandelion-allmod-hacking.zip

      - name: Upload artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: dandelion-allmod-hacking
          path: dandelion-allmod-hacking.zip
